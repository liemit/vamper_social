name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Rename APK Output
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Vamper.apk

      - name: Show SHA-1 Fingerprint
        continue-on-error: true
        run: |
          KEYSTORE=$(find ~ -name "debug.keystore" 2>/dev/null | head -n 1)
          if [ -n "$KEYSTORE" ]; then
            echo "Found keystore at: $KEYSTORE"
            keytool -list -v -keystore "$KEYSTORE" -alias androiddebugkey -storepass android -keypass android
          else
            echo "Searching gradle signing report..."
            cd android && chmod +x gradlew && ./gradlew signingReport || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vamper-Release-v1.0.0
          path: build/app/outputs/flutter-apk/Vamper.apk
